[package]
name = "balance"
version = "0.2.2"
description = "Balance"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "balance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Balance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
data-encoding = "2.11.0"
rand = "0.8.5"
chrono = "0.4.44"
rusqlite = { version = "0.32.1", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
# Multi-device sync (see src/sync): E2E sealing of changesets + convergence hashing.
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
zeroize = "1.8"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
semver = "1"

# The OS keychain integration is desktop-only. Android stores the database
# recovery key in app-private internal storage instead (see lib.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "NSEvent", "NSHapticFeedback", "NSPasteboard", "NSBitmapImageRep", "NSImageRep", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSUserDefaults", "NSData", "NSDictionary"] }

# Used to wrap the database recovery key with a hardware-backed Android Keystore
# key over JNI (see android_keystore in lib.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Camera QR-code scanning for sync pairing is mobile-only (Android/iOS); the
# plugin uses the native camera, so it isn't compiled into desktop builds.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-haptics = "2"
