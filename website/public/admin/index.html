<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balance Fonts</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <header class="bar">
    <a class="brand" href="/"><img src="/assets/logo.png" alt=""><span class="wordmark">Balance</span><span class="crumb">Fonts</span></a>
    <div class="bar-controls">
      <div class="segmented" role="group" aria-label="Preview page">
        <button type="button" data-page="/" aria-pressed="true">Home</button>
        <button type="button" data-page="/docs/" aria-pressed="false">Docs</button>
      </div>
      <div class="segmented" role="group" aria-label="Preview width">
        <button type="button" data-width="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-width="phone" aria-pressed="false">Phone</button>
      </div>
    </div>
    <div class="bar-actions">
      <span class="status" id="status" role="status"></span>
      <button type="button" class="ghost" id="revert" disabled>Revert</button>
      <button type="button" class="ghost" id="reset">Use site defaults</button>
      <button type="button" class="primary" id="save" disabled>Save</button>
    </div>
  </header>

  <div class="studio">
    <aside class="panel" id="panel">
      <ol class="roles" id="roles" aria-label="Font roles"></ol>
      <section class="picker" aria-labelledby="picker-title">
        <div class="picker-head">
          <h2 id="picker-title"></h2>
          <p id="picker-hint"></p>
        </div>
        <div class="weights" id="weights" role="group" aria-label="Weight"></div>
        <div class="filters" id="filters">
          <input type="search" id="search" placeholder="Search fonts" autocomplete="off" spellcheck="false">
          <div class="chips" id="categories" role="group" aria-label="Category"></div>
        </div>
        <div class="font-grid" id="fonts"></div>
      </section>
    </aside>

    <main class="stage" id="stage">
      <div class="frame" id="frame-wrap">
        <iframe id="preview" src="/" title="Live preview"></iframe>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
