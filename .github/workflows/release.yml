name: Publish version release

on:
  workflow_run:
    workflows:
      - Build Android
      - Sync version compatibility
      - Build Linux app
      - Build macOS arm64 app
    types:
      - completed

concurrency:
  group: version-release-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.event }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish coordinated GitHub Release
    if: >-
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Locate successful platform runs
        id: runs
        run: |
          set -euo pipefail

          find_run() {
            local workflow="$1"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$RELEASE_SHA" \
              --event push \
              --limit 20 \
              --json databaseId,status,conclusion,headBranch,createdAt \
              --jq \
                "map(select(.headBranch == \"$RELEASE_TAG\")) | sort_by(.createdAt) | last | [.databaseId, .status, .conclusion] | @tsv"
          }

          ANDROID_RUN="$(find_run android.yml)"
          COMPATIBILITY_RUN="$(find_run sync-compatibility.yml)"

          require_successful_run() {
            local platform="$1"
            local platform_run="$2"
            read -r run_id status conclusion <<< "$platform_run"
            if [[ -z "$run_id" || "$status" != "completed" ]]; then
              echo "$platform is not complete yet; a later workflow completion will retry publication."
              exit 0
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required $platform run $run_id concluded with $conclusion"
              exit 1
            fi
          }

          require_successful_run "Android" "$ANDROID_RUN"
          require_successful_run "Sync compatibility" "$COMPATIBILITY_RUN"

          read -r android_run_id _ <<< "$ANDROID_RUN"
          echo "android_run_id=$android_run_id" >> "$GITHUB_OUTPUT"

          if [[ "$RELEASE_TAG" != *-all ]]; then
            echo "build_all=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MACOS_RUN="$(find_run macos-arm64.yml)"
          LINUX_RUN="$(find_run linux.yml)"
          require_successful_run "macOS" "$MACOS_RUN"
          require_successful_run "Linux" "$LINUX_RUN"

          read -r macos_run_id _ <<< "$MACOS_RUN"
          read -r linux_run_id _ <<< "$LINUX_RUN"
          echo "build_all=true" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "macos_run_id=$macos_run_id" >> "$GITHUB_OUTPUT"
          echo "linux_run_id=$linux_run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified Android artifact
        if: steps.runs.outputs.ready == 'true'
        run: |
          mkdir -p release-assets/android
          gh run download "${{ steps.runs.outputs.android_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Balance-android-arm64 \
            --dir release-assets/android

          test -f release-assets/android/balance-arm64.apk

      - name: Download verified desktop artifacts
        if: >-
          steps.runs.outputs.ready == 'true' &&
          steps.runs.outputs.build_all == 'true'
        run: |
          mkdir -p release-assets/macos release-assets/linux
          gh run download "${{ steps.runs.outputs.macos_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Balance-macos-arm64 \
            --dir release-assets/macos
          gh run download "${{ steps.runs.outputs.linux_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Balance-linux-x86_64 \
            --dir release-assets/linux

          test -f release-assets/macos/Balance-macos-arm64.app.zip
          test -f release-assets/linux/Balance-linux-x86_64.AppImage
          test -f release-assets/linux/Balance-linux-x86_64.deb

      - name: Create or update GitHub Release
        if: steps.runs.outputs.ready == 'true'
        env:
          BUILD_ALL: ${{ steps.runs.outputs.build_all }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Balance $RELEASE_TAG" \
              --generate-notes
          fi

          ASSETS=(release-assets/android/balance-arm64.apk)
          if [[ "$BUILD_ALL" == "true" ]]; then
            ASSETS+=(
              release-assets/macos/Balance-macos-arm64.app.zip
              release-assets/linux/Balance-linux-x86_64.AppImage
              release-assets/linux/Balance-linux-x86_64.deb
            )
          fi

          gh release upload "$RELEASE_TAG" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-nightly-macos:
    name: Add the notarized Mac app to a nightly release
    # Nightly tags dispatch Android and macOS separately. Whichever finishes
    # last uploads the Mac app, once Android has published the release.
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !endsWith(github.event.workflow_run.head_branch, '-all') &&
      (github.event.workflow_run.name == 'Build Android' ||
        github.event.workflow_run.name == 'Build macOS arm64 app')
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Find the macOS build and the published release
        id: ready
        run: |
          set -euo pipefail

          read -r run_id status conclusion < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow macos-arm64.yml \
            --commit "$RELEASE_SHA" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,status,conclusion,headBranch,createdAt \
            --jq "map(select(.headBranch == \"$RELEASE_TAG\")) | sort_by(.createdAt) | last | [.databaseId, .status, .conclusion] | @tsv") || true

          if [[ -z "${run_id:-}" || "$status" != "completed" ]]; then
            echo "The macOS build is not complete yet; its completion will retry."
            exit 0
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::macOS run $run_id concluded with $conclusion"
            exit 1
          fi

          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$IS_DRAFT" != "false" ]]; then
            echo "$RELEASE_TAG is not published yet; Android's completion will retry."
            exit 0
          fi

          echo "macos_run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload the Mac app
        if: steps.ready.outputs.macos_run_id != ''
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos
          gh run download "${{ steps.ready.outputs.macos_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Balance-macos-arm64 \
            --dir release-assets/macos
          test -f release-assets/macos/Balance-macos-arm64.app.zip
          gh release upload "$RELEASE_TAG" \
            release-assets/macos/Balance-macos-arm64.app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
