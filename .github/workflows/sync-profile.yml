name: Profile sync empty polls

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/sync-profile.yml"
      - "package.json"
      - "relay-worker/**"
      - "scripts/profile-empty-relay-poll.mjs"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "src/lib/store.ts"
      - "src/lib/syncScheduler.ts"
      - "src-tauri/src/lib.rs"
      - "src-tauri/src/sync/**"
      - "tests/visual/sync-freshness.spec.ts"
  pull_request:
    paths:
      - ".github/workflows/sync-profile.yml"
      - "package.json"
      - "relay-worker/**"
      - "scripts/profile-empty-relay-poll.mjs"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "src/lib/store.ts"
      - "src/lib/syncScheduler.ts"
      - "src-tauri/src/lib.rs"
      - "src-tauri/src/sync/**"
      - "tests/visual/sync-freshness.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-reload:
    name: Mobile sync reload races
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check frontend types
        run: pnpm check

      - name: Test mobile sync reload behavior
        run: pnpm exec playwright test tests/visual/sync-freshness.spec.ts --project=mobile

  empty-poll:
    name: Empty manifest poll
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test relay contract
        run: node --test scripts/relay-server.test.mjs relay-worker/src/index.test.js

      - name: Profile empty authenticated polls
        run: |
          node scripts/profile-empty-relay-poll.mjs \
            --samples 20000 \
            --json empty-poll-profile.json | tee empty-poll-profile.txt
          {
            echo '## Empty relay poll profile'
            echo
            echo '```json'
            cat empty-poll-profile.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile results
        uses: actions/upload-artifact@v7
        with:
          name: empty-poll-profile
          path: |
            empty-poll-profile.json
            empty-poll-profile.txt

  large-task-sync:
    name: Large workspace + two long tasks
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-large-task-sync-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-large-task-sync-

      - name: Test encrypted database and sync behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Profile two-task incremental relay sync
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml \
            sync::tests::a_large_workspace_receives_two_long_duration_tasks_over_the_relay \
            -- --exact --ignored --nocapture 2>&1 | tee large-task-sync-profile.txt
          {
            echo '## Large workspace + two long tasks'
            echo
            echo '```text'
            grep 'BALANCE_RELAY_LARGE_TASK_PROFILE:' large-task-sync-profile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile results
        uses: actions/upload-artifact@v7
        with:
          name: large-task-sync-profile
          path: large-task-sync-profile.txt
