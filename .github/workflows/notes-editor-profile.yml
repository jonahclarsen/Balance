name: Profile Notes editors

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Measured runs per editor (order rotates each round)
        required: true
        default: "5"
        type: string
      cpu_rate:
        description: Chromium CPU throttling rate
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  profile:
    name: Classic vs TipTap vs Lexical on macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ROUNDS: ${{ inputs.rounds }}
      BALANCE_NOTES_PERF_CPU_RATE: ${{ inputs.cpu_rate }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Rotate editors across measured rounds
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/notes-editor-performance.jsonl"
          logs="$RUNNER_TEMP/notes-editor-performance.log"
          : > "$results"
          : > "$logs"
          editors=(classic tiptap lexical)

          run_profile() {
            editor="$1"
            round="$2"
            echo "Running $editor round $round" | tee -a "$logs"
            for attempt in 1 2 3; do
              set +e
              output="$(BALANCE_NOTES_PERF_EDITOR="$editor" pnpm exec playwright test \
                --config playwright.notes-editor-performance.config.ts --trace off 2>&1)"
              command_exit="$?"
              set -e
              printf '%s\n' "$output" | tee -a "$logs"
              if (( command_exit == 0 )); then break; fi
              echo "Attempt $attempt failed for $editor round $round" | tee -a "$logs"
              if (( attempt == 3 )); then return "$command_exit"; fi
            done
            payload="$(printf '%s\n' "$output" | sed -n 's/^NOTES_EDITOR_PERF //p')"
            test -n "$payload"
            jq -cn --argjson round "$round" --argjson profile "$payload" \
              '{round: $round, profile: $profile}' >> "$results"
          }

          for (( round = 1; round <= ROUNDS; round += 1 )); do
            shift_by=$(( (round - 1) % 3 ))
            for (( index = 0; index < 3; index += 1 )); do
              run_profile "${editors[$(( (index + shift_by) % 3 ))]}" "$round"
            done
          done

          summary="$(jq -s '
            def median: map(select(. != null)) | sort | if length == 0 then null else .[length / 2 | floor] end;
            def metrics: {
              "Open 1k-block note (ms)": .openLarge.ms,
              "Reopen 1k-block note (ms)": .openLarge.reopenMs,
              "Switch 150-block notes, median (ms)": .switchMedium.medianMs,
              "Keystroke to frame, median (ms)": .typing.medianMs,
              "Keystroke to frame, p95 (ms)": .typing.p95Ms,
              "CPU per keystroke (ms)": .typing.taskMsPerKey,
              "Enter (split), median (ms)": .enter.medianMs,
              "Backspace (merge), median (ms)": .backspace.medianMs,
              "Paste 100 blocks (ms)": .paste.ms,
              "Scroll frame p95 (ms)": .scroll.p95Ms,
              "Scroll frames over 32ms": .scroll.framesOver32Ms,
              "JS heap for 1k-block note (MB)": .memory.largeHeapMb,
              "DOM nodes for 1k-block note": .memory.largeDomNodes,
              "Idle CPU while focused (ms/s)": .idleTaskMsPerSecond
            };
            group_by(.profile.editor)
            | map({
                key: .[0].profile.editor,
                value: ([.[].profile | metrics] as $runs
                  | ($runs[0] | keys_unsorted) | map({key: ., value: ([$runs[][.]] | median)}) | from_entries)
              })
            | from_entries
          ' "$results")"
          printf '%s\n' "$summary" > "$RUNNER_TEMP/notes-editor-performance-summary.json"
          {
            echo '## Notes editor profile'
            echo
            echo "Commit \`$GITHUB_SHA\` · $ROUNDS rotating rounds per editor · Desktop Chrome with ${BALANCE_NOTES_PERF_CPU_RATE}× CPU throttling · medians across rounds (lower is better)."
            echo
            echo '| Metric | Classic | TipTap | Lexical |'
            echo '|---|---:|---:|---:|'
            printf '%s\n' "$summary" | jq -r '
              . as $all | ($all.classic | keys_unsorted)[] as $metric
              | "| \($metric) | \($all.classic[$metric]) | \($all.tiptap[$metric]) | \($all.lexical[$metric]) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notes-editor-profile
          path: |
            ${{ runner.temp }}/notes-editor-performance.jsonl
            ${{ runner.temp }}/notes-editor-performance-summary.json
            ${{ runner.temp }}/notes-editor-performance.log
          if-no-files-found: warn
