name: Explore retro theme performance
on:
  workflow_dispatch:
    inputs:
      color_scheme:
        description: Appearance to measure
        default: light
        type: choice
        options: [light, dark]
      themes:
        description: JSON array of theme IDs
        default: '["graphite","windows98","system1","windowsxp","windowsvista"]'
        type: string
      runners:
        description: JSON array of hosted runner labels
        default: '["ubuntu-24.04","macos-15-intel"]'
        type: string
      sizes:
        description: JSON array of standard, decade, or dense workloads
        default: '["standard","decade"]'
        type: string
      baseline_ref:
        description: Optional revision for alternating matched comparison
        default: ''
        type: string
      experiments:
        description: Comma-separated interventions (baseline always supported)
        default: baseline,sidebar-no-blur,header-no-blur,sidebar-style,sidebar-layout,sidebar-layer,header-layer,panel-style,panel-layout,workspace-style
        type: string
      rounds:
        description: Repetitions, alternating intervention order
        default: '3'
        type: string
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        theme: ${{ fromJSON(inputs.themes) }}
        size: ${{ fromJSON(inputs.sizes) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPERIMENTS: ${{ inputs.experiments }}
      ROUNDS: ${{ inputs.rounds }}
      BALANCE_INTERACTION_PERF_RELEASE: '1'
      BALANCE_INTERACTION_PERF_PROFILE_ONLY: '1'
      BALANCE_INTERACTION_PERF_COLOR_SCHEME: ${{ inputs.color_scheme }}
      BALANCE_INTERACTION_PERF_THEME: ${{ matrix.theme }}
      BALANCE_INTERACTION_PERF_PLANS: ${{ matrix.size == 'decade' && '3650' || '365' }}
      BALANCE_INTERACTION_PERF_ITEMS_PER_PLAN: ${{ matrix.size == 'dense' && '1000' || matrix.size == 'decade' && '50' || '20' }}
      BALANCE_INTERACTION_PERF_LISTS: ${{ matrix.size == 'decade' && '1000' || '180' }}
      BALANCE_INTERACTION_PERF_ITEMS_PER_LIST: ${{ matrix.size == 'decade' && '50' || '20' }}
      BALANCE_INTERACTION_PERF_GOALS: ${{ matrix.size == 'decade' && '200' || '80' }}
      BALANCE_INTERACTION_PERF_OPERATIONS: '10000'
      BALANCE_INTERACTION_PERF_EDITS: '16'
      BALANCE_INTERACTION_PERF_CLICKS: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare matched baseline with the same harness
        if: inputs.baseline_ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}" >/dev/null 2>&1; then
            baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          else
            git fetch --no-tags origin "$BASELINE_REF"
            baseline_sha="$(git rev-parse FETCH_HEAD)"
          fi
          echo "Baseline revision: $baseline_sha" >> "$GITHUB_STEP_SUMMARY"
          baseline="$RUNNER_TEMP/retro-baseline"
          git worktree add --detach "$baseline" "$baseline_sha"
          cp tests/performance/interactions.spec.ts "$baseline/tests/performance/interactions.spec.ts"
          cp tests/helpers/navigation.ts "$baseline/tests/helpers/navigation.ts"
          cp playwright.interaction-performance.config.ts "$baseline/playwright.interaction-performance.config.ts"
          (cd "$baseline" && pnpm install --frozen-lockfile --offline)
          echo "BASELINE_DIR=$baseline" >> "$GITHUB_ENV"
      - run: node .github/scripts/profile-retro-themes.mjs
      - run: node .github/scripts/summarize-retro-themes.mjs >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retro-${{ matrix.runner }}-${{ matrix.theme }}-${{ matrix.size }}
          path: artifacts/retro-profile
