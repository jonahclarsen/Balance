name: Explore retro theme performance
on:
  push:
    branches: [perf/retro-theme-profiling]
    paths: ['.github/workflows/retro-theme-profile.yml', '.github/scripts/profile-retro-themes.mjs']
  workflow_dispatch:
    inputs:
      experiments:
        description: Comma-separated interventions (baseline always supported)
        default: baseline,sidebar-no-blur,header-no-blur,sidebar-style,sidebar-layout,sidebar-layer,header-layer,panel-style,panel-layout,workspace-style
        type: string
      rounds:
        description: Repetitions, alternating intervention order
        default: '3'
        type: string
permissions:
  contents: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15-intel]
        theme: [graphite, windows98, system1, windowsxp, windowsvista]
        size: [standard, decade]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPERIMENTS: ${{ inputs.experiments }}
      ROUNDS: ${{ inputs.rounds }}
      BALANCE_INTERACTION_PERF_RELEASE: '1'
      BALANCE_INTERACTION_PERF_PROFILE_ONLY: '1'
      BALANCE_INTERACTION_PERF_THEME: ${{ matrix.theme }}
      BALANCE_INTERACTION_PERF_PLANS: ${{ matrix.size == 'decade' && '3650' || '365' }}
      BALANCE_INTERACTION_PERF_ITEMS_PER_PLAN: ${{ matrix.size == 'decade' && '50' || '20' }}
      BALANCE_INTERACTION_PERF_LISTS: ${{ matrix.size == 'decade' && '1000' || '180' }}
      BALANCE_INTERACTION_PERF_ITEMS_PER_LIST: ${{ matrix.size == 'decade' && '50' || '20' }}
      BALANCE_INTERACTION_PERF_GOALS: ${{ matrix.size == 'decade' && '200' || '80' }}
      BALANCE_INTERACTION_PERF_OPERATIONS: '10000'
      BALANCE_INTERACTION_PERF_EDITS: '16'
      BALANCE_INTERACTION_PERF_CLICKS: '8'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node .github/scripts/profile-retro-themes.mjs
      - run: node .github/scripts/summarize-retro-themes.mjs >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retro-${{ matrix.runner }}-${{ matrix.theme }}-${{ matrix.size }}
          path: artifacts/retro-profile
