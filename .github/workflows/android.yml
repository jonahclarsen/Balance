name: Build Android

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Internal release tag passed by the nightly coordinator
        required: false
        default: ""
        type: string
      build_release:
        description: Also build a signed arm64 APK (release tags always do)
        required: false
        default: false
        type: boolean
      run_ui_pairing:
        description: Run the slower camera and UI Automator pairing journey
        required: false
        default: false
        type: boolean
      run_resume_stress:
        description: Stress Android background-job overlap while reopening the app
        required: false
        default: false
        type: boolean
      run_sync_catchup_profile:
        description: Profile a synthetic multi-batch Android background catch-up
        required: false
        default: false
        type: boolean
      run_interaction_stress:
        description: Run three seeded real-WebView navigation and Notes stress journeys
        required: false
        default: false
        type: boolean
      run_startup_deadlock_stress:
        description: Force-stop and relaunch from Notes 300 times to check Android plugin startup
        required: false
        default: false
        type: boolean
      run_list_history_stress:
        description: Open and close List History 300 times while checking Android responsiveness
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-debug:
    name: Build x86_64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # setup-gradle persists this local build cache between generated projects.
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Android debug project
        uses: ./.github/actions/setup-android-build
        with:
          variant: debug-x86_64
          rust-target: x86_64-linux-android
          generate-sync-fixture: "true"

      - name: Build x86_64 debug APK for the emulator
        run: pnpm tauri android build --apk --debug --target x86_64

      - name: Locate and verify APK
        id: apk
        run: |
          APK_PATH="$(find src-tauri/gen/android -name '*.apk' -path '*debug*' | head -n 1)"
          test -n "$APK_PATH"
          echo "Found APK at $APK_PATH"
          file "$APK_PATH"
          # This APK only runs in CI's x86_64 emulator. The separately signed
          # release APK below targets the arm64 Samsung device.
          unzip -l "$APK_PATH" | tee apk-contents.txt
          grep -q "lib/x86_64/libbalance_lib.so" apk-contents.txt
          if grep -q "lib/arm64-v8a/" apk-contents.txt; then
            echo "::error::The emulator APK unexpectedly contains arm64 libraries"
            exit 1
          fi
          cp "$APK_PATH" balance-debug.apk
          echo "path=balance-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Balance-android-debug
          path: |
            balance-debug.apk
            sync-e2e-pairing.png
            sync-e2e-pairing-code.txt
          if-no-files-found: error

  build-release:
    name: Build signed arm64 release APK
    if: github.ref_type == 'tag' || inputs.build_release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Manual builds need the release tags so their version is guaranteed
          # to be newer than the APK currently installed on a phone.
          fetch-depth: 0

      - name: Resolve Android release version
        id: android-version
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [[ -n "$PUBLISH_TAG" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$PUBLISH_TAG" ]]; then
              echo "::error::publish_tag must match the workflow's tag ref"
              exit 1
            fi
            if [[ ! "$PUBLISH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid coordinated release tag: $PUBLISH_TAG"
              exit 1
            fi
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_SOURCE="tag $GITHUB_REF_NAME"
          else
            LATEST_STABLE_TAG=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                LATEST_STABLE_TAG="$candidate"
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                break
              fi
            done < <(git tag --list --sort=-version:refname)

            if [[ -n "$LATEST_STABLE_TAG" ]]; then
              VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
              VERSION_SOURCE="next patch after $LATEST_STABLE_TAG"
            else
              VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
              VERSION_SOURCE="src-tauri/tauri.conf.json (no stable release tag found)"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Android release version: $VERSION"
            exit 1
          fi

          echo "Building Android release version $VERSION from $VERSION_SOURCE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Record coordinated release tag
        if: inputs.publish_tag != ''
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: printf '%s\n' "$PUBLISH_TAG" > release-tag.txt

      - name: Upload coordinated release metadata
        if: inputs.publish_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: Balance-release-metadata
          path: release-tag.txt
          if-no-files-found: error

      - name: Set up Android release project
        uses: ./.github/actions/setup-android-build
        with:
          variant: release-arm64
          rust-target: aarch64-linux-android

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # R8 is expensive and only useful for production artifacts. Tags keep
          # it enabled; manually requested development releases skip it.
          BALANCE_ANDROID_MINIFY_RELEASE: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/balance-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"

          node .github/scripts/configure-android-signing.mjs

      - name: Build signed arm64 release APK
        run: |
          pnpm tauri android build \
            --config "{\"version\":\"${ANDROID_RELEASE_VERSION}\"}" \
            --apk --target aarch64

      - name: Locate and verify signed release
        run: |
          set -o pipefail
          APK_PATH="$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APK_PATH"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          echo "Found APK at $APK_PATH"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee android-release-signature.txt
          "$AAPT" dump badging "$APK_PATH" | sed -n '1p' | tee android-release-package.txt
          grep -Fq "versionName='${ANDROID_RELEASE_VERSION}'" android-release-package.txt
          unzip -l "$APK_PATH" | tee android-release-contents.txt
          grep -q "lib/arm64-v8a/libbalance_lib.so" android-release-contents.txt
          if grep -q "lib/x86_64/" android-release-contents.txt; then
            echo "::error::The phone APK unexpectedly contains x86_64 libraries"
            exit 1
          fi

          cp "$APK_PATH" balance-arm64.apk

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Balance-android-arm64
          path: |
            balance-arm64.apk
            android-release-signature.txt
            android-release-package.txt
            android-release-contents.txt
          if-no-files-found: error

  smoke-test:
    name: Android pairing + sync E2E
    needs: build-debug
    runs-on: ubuntu-latest
    # Successful runs take about five minutes. Keep a little headroom for a
    # cold emulator, but never let an ADB/emulator wedge consume hours.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-debug

      - name: Pair and sync two isolated app installations
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Release tags run the deterministic core smoke suite. The WebView
          # accessibility journey is available deliberately for UI debugging,
          # but is too flaky and expensive to remain a release gate.
          BALANCE_RUN_UI_PAIRING_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_pairing && '1' || '0' }}
          BALANCE_RUN_RESUME_STRESS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_resume_stress && '1' || '0' }}
          BALANCE_RUN_SYNC_CATCHUP_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sync_catchup_profile && '1' || '0' }}
        with:
          api-level: 34
          arch: x86_64
          # The AOSP image provides Android/WebView without launching a second
          # profile's full Play Services fleet, which can OOM the CI runner.
          target: default
          force-avd-creation: false
          # Feed the real QR fixture to Android's emulated back camera. The UI
          # test must scan it; it never types the joiner's pairing code.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/sync-e2e-pairing.png
          disable-animations: true
          # UI Automator enters text through adb's hardware-input path. Keep the
          # soft keyboard from covering the next WebView field between entries.
          enable-hw-keyboard: true
          # The runner executes the `script` input line-by-line in separate
          # shells, so the test logic lives in a committed file run as one process.
          # This inner deadline exits early enough for the always() diagnostics
          # upload below to run before the job-level deadline.
          script: timeout --foreground --kill-after=30s 10m bash .github/scripts/android-smoke-test.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logcat
          path: |
            logcat*.txt
            android-startup-profile.json
            sync-e2e-large-task-profile.json
            android-resume-stress.json
            android-resume-relay.log
            android-sync-catchup-profile.json
            android-sync-catchup-relay.log
            android-sync-catchup-logcat.txt
            android-sync-catchup-jobscheduler.txt
            startup-profile-log.txt
            sync-e2e-*.xml
            sync-e2e-*.png
          if-no-files-found: ignore

  interaction-stress:
    name: Android interaction stress (seed ${{ matrix.seed }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_interaction_stress
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        seed: [1701, 2947, 4813]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-debug

      - name: Exercise navigation, Notes, features, and lifecycle transitions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_INTERACTION_STRESS_SEED: ${{ matrix.seed }}
          BALANCE_INTERACTION_STRESS_SECONDS: "600"
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: true
          script: timeout --foreground --kill-after=30s 20m node .github/scripts/android-interaction-stress.mjs

      - name: Upload interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-interaction-stress-${{ matrix.seed }}
          path: |
            android-interaction-stress-*.json
            android-interaction-logcat-*.txt
            android-interaction-meminfo-*.txt
            android-interaction-gfxinfo-*.txt
            android-interaction-activity-*.txt
            android-interaction-window-*.txt
            android-interaction-failure-*.png
            android-interaction-bugreport-*.zip
          if-no-files-found: ignore

  startup-deadlock-stress:
    name: Android startup deadlock stress (seed ${{ matrix.seed }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_startup_deadlock_stress
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        seed: [1701, 2947, 4813]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-debug

      - name: Relaunch repeatedly from Notes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_INTERACTION_STRESS_SEED: ${{ matrix.seed }}
          BALANCE_INTERACTION_STRESS_SECONDS: "30"
          BALANCE_INTERACTION_STRESS_RELAUNCHES: "100"
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: true
          script: timeout --foreground --kill-after=30s 20m node .github/scripts/android-interaction-stress.mjs

      - name: Upload startup deadlock diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-startup-deadlock-stress-${{ matrix.seed }}
          path: |
            android-interaction-stress-*.json
            android-interaction-logcat-*.txt
            android-interaction-meminfo-*.txt
            android-interaction-gfxinfo-*.txt
            android-interaction-activity-*.txt
            android-interaction-window-*.txt
            android-interaction-failure-*.png
            android-interaction-bugreport-*.zip
          if-no-files-found: ignore

  list-history-stress:
    name: Android List History stress (seed ${{ matrix.seed }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_list_history_stress
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        seed: [1701, 2947, 4813]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-debug

      - name: Exercise List History transitions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_INTERACTION_STRESS_SEED: ${{ matrix.seed }}
          BALANCE_INTERACTION_STRESS_SECONDS: "30"
          BALANCE_INTERACTION_STRESS_LIST_HISTORY_TRANSITIONS: "100"
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: true
          script: timeout --foreground --kill-after=30s 15m node .github/scripts/android-interaction-stress.mjs

      - name: Upload List History diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-list-history-stress-${{ matrix.seed }}
          path: |
            android-interaction-stress-*.json
            android-interaction-logcat-*.txt
            android-interaction-meminfo-*.txt
            android-interaction-gfxinfo-*.txt
            android-interaction-activity-*.txt
            android-interaction-window-*.txt
            android-interaction-failure-*.png
            android-interaction-bugreport-*.zip
          if-no-files-found: ignore

  publish-nightly-release:
    name: Publish coordinated nightly release
    needs:
      - build-release
      - smoke-test
    if: >-
      inputs.publish_tag != '' &&
      needs['build-release'].result == 'success' &&
      needs['smoke-test'].result == 'success'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.publish_tag }}

    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified Android artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-arm64
          path: release-assets/android

      - name: Download coordinated release metadata
        uses: actions/download-artifact@v7
        with:
          name: Balance-release-metadata
          path: release-assets/context

      - name: Validate coordinated release
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid coordinated release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::Coordinated release tag must match the workflow tag ref"
            exit 1
          fi
          if [[ "$(git rev-parse "$RELEASE_TAG^{}")" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG does not resolve to workflow commit $GITHUB_SHA"
            exit 1
          fi

          RECORDED_TAG="$(tr -d '\r\n' < release-assets/context/release-tag.txt)"
          if [[ "$RECORDED_TAG" != "$RELEASE_TAG" ]]; then
            echo "::error::Release metadata names $RECORDED_TAG instead of $RELEASE_TAG"
            exit 1
          fi

          test -f release-assets/android/balance-arm64.apk

      - name: Create or update GitHub Release
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Balance $RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/android/balance-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
