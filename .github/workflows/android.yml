name: Build Android

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug + signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The vendored OpenSSL that SQLCipher links against is cross-compiled with
      # the Android NDK. openssl-src locates the toolchain through these.
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Manual builds need the release tags so their version is guaranteed
          # to be newer than the APK currently installed on a phone.
          fetch-depth: 0

      - name: Resolve Android release version
        id: android-version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_SOURCE="tag $GITHUB_REF_NAME"
          else
            LATEST_STABLE_TAG=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                LATEST_STABLE_TAG="$candidate"
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                break
              fi
            done < <(git tag --list --sort=-version:refname)

            if [[ -n "$LATEST_STABLE_TAG" ]]; then
              VERSION="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
              VERSION_SOURCE="next patch after $LATEST_STABLE_TAG"
            else
              VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
              VERSION_SOURCE="src-tauri/tauri.conf.json (no stable release tag found)"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Android release version: $VERSION"
            exit 1
          fi

          echo "Building Android release version $VERSION from $VERSION_SOURCE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"

      - name: Expose NDK toolchain with legacy tool names
        run: |
          # NDK r23+ ships only llvm-prefixed binutils (llvm-ar, llvm-ranlib, ...).
          # The vendored OpenSSL build still calls the GCC-era names such as
          # aarch64-linux-android-ranlib, so add the toolchain to PATH and create
          # the legacy-named symlinks it expects, for every ABI we cross-compile.
          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"
          for prefix in aarch64-linux-android x86_64-linux-android; do
            for tool in ar ranlib nm strip; do
              ln -sf "${TOOLCHAIN}/llvm-${tool}" "${TOOLCHAIN}/${prefix}-${tool}"
            done
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android camera QR fixture
        run: node .github/scripts/generate-android-sync-qr.mjs

      - name: Initialize Android project
        run: pnpm tauri android init

      - name: Allow active direct sync to survive screen-off sleep
        # The Rust sync command holds CPU + Wi-Fi locks only for the lifetime of
        # an in-flight direct sync, then releases them immediately.
        run: node .github/scripts/configure-android-sync-wake-lock.mjs

      - name: Configure automatic background relay sync
        run: node .github/scripts/configure-android-background-sync.mjs

      - name: Configure home and lock-screen widgets
        # Generated Android sources are CI-only. This adds both providers,
        # their RemoteViews/resources, and the native encrypted-DB bridge.
        run: node .github/scripts/configure-android-widgets.mjs

      - name: Bundle the offline Android barcode model
        # The upstream plugin uses the dynamically downloaded Play Services
        # model. Bundle ML Kit instead so scanning works immediately, including
        # on Android devices and CI images without Google Play Services.
        run: node .github/scripts/configure-android-barcode-scanner.mjs

      - name: Apply app launcher icons
        # `tauri android init` scaffolds gen/android with placeholder launcher
        # icons. Overlay the committed mipmaps (generated from app-icon.png with
        # `tauri icon`) so the APK uses the real app icon.
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build x86_64 debug APK for the emulator
        run: pnpm tauri android build --apk --debug --target x86_64

      - name: Locate and verify APK
        id: apk
        run: |
          APK_PATH="$(find src-tauri/gen/android -name '*.apk' -path '*debug*' | head -n 1)"
          test -n "$APK_PATH"
          echo "Found APK at $APK_PATH"
          file "$APK_PATH"
          # This APK only runs in CI's x86_64 emulator. The separately signed
          # release APK below targets the arm64 Samsung device.
          unzip -l "$APK_PATH" | tee apk-contents.txt
          grep -q "lib/x86_64/libbalance_lib.so" apk-contents.txt
          if grep -q "lib/arm64-v8a/" apk-contents.txt; then
            echo "::error::The emulator APK unexpectedly contains arm64 libraries"
            exit 1
          fi
          cp "$APK_PATH" balance-debug.apk
          echo "path=balance-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Balance-android-debug
          path: |
            balance-debug.apk
            sync-e2e-pairing.png
            sync-e2e-pairing-code.txt
          if-no-files-found: error

      - name: Set up Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/balance-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"

          node .github/scripts/configure-android-signing.mjs

      - name: Build signed arm64 release APK
        run: |
          pnpm tauri android build \
            --config "{\"version\":\"${ANDROID_RELEASE_VERSION}\"}" \
            --apk --target aarch64

      - name: Locate and verify signed release
        run: |
          set -o pipefail
          APK_PATH="$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APK_PATH"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          echo "Found APK at $APK_PATH"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee android-release-signature.txt
          "$AAPT" dump badging "$APK_PATH" | sed -n '1p' | tee android-release-package.txt
          grep -Fq "versionName='${ANDROID_RELEASE_VERSION}'" android-release-package.txt
          unzip -l "$APK_PATH" | tee android-release-contents.txt
          grep -q "lib/arm64-v8a/libbalance_lib.so" android-release-contents.txt
          if grep -q "lib/x86_64/" android-release-contents.txt; then
            echo "::error::The phone APK unexpectedly contains x86_64 libraries"
            exit 1
          fi

          cp "$APK_PATH" balance-arm64.apk

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Balance-android-arm64
          path: |
            balance-arm64.apk
            android-release-signature.txt
            android-release-package.txt
            android-release-contents.txt
          if-no-files-found: error

  smoke-test:
    name: Android pairing + sync E2E
    needs: build
    runs-on: ubuntu-latest
    # Successful runs take about five minutes. Keep a little headroom for a
    # cold emulator, but never let an ADB/emulator wedge consume hours.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: Balance-android-debug

      - name: Pair and sync two isolated app installations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # The AOSP image provides Android/WebView without launching a second
          # profile's full Play Services fleet, which can OOM the CI runner.
          target: default
          force-avd-creation: false
          # Feed the real QR fixture to Android's emulated back camera. The UI
          # test must scan it; it never types the joiner's pairing code.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/sync-e2e-pairing.png
          disable-animations: true
          # UI Automator enters text through adb's hardware-input path. Keep the
          # soft keyboard from covering the next WebView field between entries.
          enable-hw-keyboard: true
          # The runner executes the `script` input line-by-line in separate
          # shells, so the test logic lives in a committed file run as one process.
          # This inner deadline exits early enough for the always() diagnostics
          # upload below to run before the job-level deadline.
          script: timeout --foreground --kill-after=30s 10m bash .github/scripts/android-smoke-test.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logcat
          path: |
            logcat*.txt
            sync-e2e-*.xml
            sync-e2e-*.png
          if-no-files-found: ignore
