name: Android activity lifecycle regression

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Optional historical app commit for before/after reproduction (tests use this branch)
        type: string
        default: ''
      apk_run_id:
        description: Reuse the optimized synthetic APK from a previous lifecycle run (test harness only)
        type: string
        default: ''
      scenario:
        description: Lifecycle path to verify with synthetic data
        type: choice
        default: activity
        options: [activity, situate, situate-stress, voice-recording, voice-permissions, process, worker-start, offline-ideas, offline-history, offline-notifications, offline-latency, startup-ab]
      situate_api:
        description: Android API for Situate stress (all includes 31, 34, 36, and 37)
        type: choice
        default: all
        options: [all, '31', '34', '36', '37']
      situate_pages:
        description: Page-size variant for API 36/37 (16k requires selecting one of those APIs)
        type: choice
        default: normal
        options: [normal, 16k]
      situate_case:
        description: Situate stress case to run (all runs the full matrix)
        type: choice
        default: all
        options: [all, restart, event-loss, navigation, idle]
      baseline_apk_run_id:
        description: For startup-ab, the lifecycle run whose APK is the baseline build
        type: string
        default: ''
      repetitions:
        description: Activity or process cycles per Android version
        type: choice
        default: "20"
        options: ["20", "100"]
      offline_background_seconds:
        description: Offline background duration after idea saves
        type: choice
        default: "0"
        options: ["0", "600"]

permissions:
  contents: read
  actions: read

jobs:
  capture-acknowledgement:
    if: ${{ !startsWith(inputs.scenario, 'situate') && !startsWith(inputs.scenario, 'voice-') }}
    name: Offline refresh and durable capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual tests/visual/sync-freshness.spec.ts --grep 'Quick Add waits|offline refresh reuses|incremental history' --project=desktop --project=mobile --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-capture-acknowledgement-traces
          path: artifacts/playwright

  build:
    name: Build optimized CI APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.app_ref || github.sha }}
      - name: Reuse an optimized synthetic test APK
        if: inputs.apk_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: gh run download "$APK_RUN_ID" --name Balance-android-lifecycle-test-apk
      - uses: ./.github/actions/setup-android-build
        if: inputs.apk_run_id == ''
        with:
          variant: lifecycle-release-x86_64
          rust-target: x86_64-linux-android
          generate-sync-fixture: "true"
      - name: Enable inspection for the synthetic test installation
        if: inputs.apk_run_id == ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/gen/android/app/build.gradle.kts')
          source = p.read_text()
          marker = 'getByName("release") {'
          assert marker in source
          p.write_text(source.replace(marker, marker + '\n            isDebuggable = true'))
          PY
      - name: Add synthetic event-loss fault injection and fixture apps
        if: inputs.apk_run_id == '' && inputs.scenario == 'situate-stress'
        run: |
          node .github/scripts/inject-situate-ci-faults.mjs
          bash .github/scripts/build-situate-ci-fixtures.sh
      - name: Build with release optimization and shrinking
        if: inputs.apk_run_id == ''
        run: pnpm tauri android build --apk --target x86_64 --features tauri/devtools
      - name: Sign only for this disposable CI installation
        if: inputs.apk_run_id == ''
        run: |
          keytool -genkeypair -keystore /tmp/lifecycle-test.jks -storepass android -keypass android -alias androiddebugkey -dname "CN=Android CI Synthetic" -keyalg RSA -validity 2
          APK_PATH="$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -n 1)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks /tmp/lifecycle-test.jks --ks-pass pass:android --out balance-debug.apk "$APK_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
          retention-days: 1
          path: |
            balance-debug.apk
            sync-e2e-pairing-code.txt
            situate-allowed.apk
            situate-blocked.apk

  voice-recording:
    if: inputs.scenario == 'voice-recording'
    name: Voice recording notification / Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # The Android 31 image's WebView 91 is too old for Balance to save anything.
        api: [34, 36]
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
      - name: Record in the background and stop from the notification
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_TEST_PACKAGE: app.balance.local
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout --foreground --kill-after=10s 5m node .github/scripts/android-voice-recording-test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-recording-api-${{ matrix.api }}
          path: |
            logcat-voice-recording.txt
            voice-recording-notifications.txt
          if-no-files-found: ignore

  voice-permissions:
    if: inputs.scenario == 'voice-permissions'
    name: Voice permission prompts / Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The Android 31 image's WebView 91 is too old for Balance to save anything.
        api: [34, 36, 37]
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
      - name: Start recording through the permission prompts
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_TEST_PACKAGE: app.balance.local
        with:
          api-level: ${{ matrix.api == 37 && '37.0' || format('{0}', matrix.api) }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-boot-anim -camera-back none
          disable-animations: true
          script: timeout --foreground --kill-after=10s 18m node .github/scripts/android-voice-permissions-test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-permissions-api-${{ matrix.api }}
          path: |
            voice-crash-*
          if-no-files-found: ignore

  situate:
    if: inputs.scenario != 'situate-stress' && !startsWith(inputs.scenario, 'voice-')
    name: Situate blocking / Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34, 36]
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
      - name: Prepare emulator with retryable SDK downloads
        run: bash .github/scripts/prepare-situate-emulator.sh ${{ matrix.api }}
      - name: Verify blocking and unblocking with the optimized APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_TEST_PACKAGE: app.balance.local
          BALANCE_SITUATE_INSTALL: "1"
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: timeout --foreground --kill-after=10s 5m bash .github/scripts/android-situate-enforcement.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: situate-api-${{ matrix.api }}
          path: |
            logcat-situate-enforcement.txt
            situate-accessibility.txt
            situate-windows.txt
            situate-notification.txt
            situate-gate.png
            situate-gate-window.txt
          if-no-files-found: ignore

  situate-stress:
    if: inputs.scenario == 'situate-stress'
    name: Situate stress / API ${{ matrix.api }} / ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.situate_api && inputs.situate_api != 'all' && format('[{0}]', inputs.situate_api) || '[31,34,36,37]') }}
        scenario: ${{ fromJSON(inputs.situate_case && inputs.situate_case != 'all' && format('["{0}"]', inputs.situate_case) || '["restart","event-loss","navigation","idle"]') }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
      - name: Prepare emulator with retryable SDK downloads
        run: bash .github/scripts/prepare-situate-emulator.sh ${{ matrix.api }} ${{ inputs.situate_pages == '16k' && 'google_apis_ps16k' || 'google_apis' }}
      - name: Exercise lifecycle, identity recovery, and background restrictions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_SITUATE_SCENARIO: ${{ matrix.scenario }}
          BALANCE_SITUATE_SEED: ${{ matrix.api }}
          BALANCE_SITUATE_REPEATS: ${{ inputs.repetitions || '20' }}
          BALANCE_SITUATE_PAGES: ${{ inputs.situate_pages || 'normal' }}
        with:
          api-level: ${{ matrix.api == 37 && '37.0' || format('{0}', matrix.api) }}
          arch: x86_64
          target: ${{ inputs.situate_pages == '16k' && 'google_apis_ps16k' || 'google_apis' }}
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: timeout --foreground --kill-after=15s 20m node .github/scripts/android-situate-stress.mjs
      - name: Retain synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: situate-stress-${{ matrix.api }}-${{ matrix.scenario }}
          path: situate-stress-*
          if-no-files-found: ignore

  lifecycle:
    if: ${{ !startsWith(inputs.scenario, 'situate') && !startsWith(inputs.scenario, 'voice-') }}
    name: Android ${{ matrix.api }} / ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scenario == 'startup-ab' && 45 || 25 }}
    env:
      # install-ci-webview.sh relaunches the emulator with these if it dies while rebooting.
      BALANCE_EMULATOR_OPTIONS: -no-window -gpu lavapipe -noaudio -no-boot-anim -memory 2048 -writable-system
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34]
        # Keep release coverage for teardown, durable capture, large offline
        # workspaces, returning after an edit, and the JNI callback that R8 can
        # otherwise remove.
        scenario: ${{ fromJSON(inputs.scenario && format('["{0}"]', inputs.scenario) || '["activity","offline-ideas","offline-history","offline-notifications","offline-latency"]') }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: Balance-android-lifecycle-test-apk
      - name: Fetch pinned AOSP WebView for both Android versions
        run: |
          curl --fail --location --retry 3 'https://android.googlesource.com/platform/external/chromium-webview/+/27ac2bdb9a1a4e55dc65bb6cdc752dbfdea3b9f4/128.0.6613.88/x86_64/webview.apk?format=TEXT' | base64 --decode > ci-webview.apk
      - name: Fetch the baseline APK for the same-emulator comparison
        if: matrix.scenario == 'startup-ab'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_apk_run_id }}
        run: |
          test -n "$BASELINE_RUN_ID"
          gh run download "$BASELINE_RUN_ID" --name Balance-android-lifecycle-test-apk --dir baseline-apk
          mv baseline-apk/balance-debug.apk baseline-debug.apk
      - name: Destroy background activities and verify reopening and durable edits
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BALANCE_TEST_PACKAGE: app.balance.local
          BALANCE_LIFECYCLE_SCENARIO: ${{ matrix.scenario }}
          BALANCE_LIFECYCLE_REPEATS: ${{ inputs.repetitions || '20' }}
          BALANCE_OFFLINE_BACKGROUND_SECONDS: ${{ inputs.offline_background_seconds || '0' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: ${{ env.BALANCE_EMULATOR_OPTIONS }}
          disable-animations: true
          enable-hw-keyboard: true
          script: |
            bash .github/scripts/install-ci-webview.sh
            timeout --foreground --kill-after=30s ${{ matrix.scenario == 'startup-ab' && '40m' || '20m' }} node .github/scripts/${{ matrix.scenario == 'startup-ab' && 'android-startup-ab.mjs' || 'android-activity-recreation-test.mjs' }}
      - name: Retain host diagnostics
        if: always()
        run: bash .github/scripts/collect-android-host-diagnostics.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lifecycle-${{ matrix.api }}-${{ matrix.scenario }}
          retention-days: 7
          path: |
            android-lifecycle-*
            android-host-diagnostics.txt
            emulator-relaunch-*.log
