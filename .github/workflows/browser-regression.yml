name: Focused browser regression tests
on:
  workflow_dispatch:
    inputs:
      spec:
        description: Playwright spec path
        type: string
        required: true
        default: tests/visual/entity-storage.spec.ts
      grep:
        description: Test title pattern
        type: string
        default: '.*'
      repeat:
        description: Repetitions per test
        type: string
        default: '1'
      runner:
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, ubuntu-24.04]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the requested regression
        env:
          SPEC: ${{ inputs.spec }}
          TITLE_PATTERN: ${{ inputs.grep }}
          REPEATS: ${{ inputs.repeat }}
        run: pnpm exec playwright test "$SPEC" --grep "$TITLE_PATTERN" --repeat-each "$REPEATS" --project=desktop --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: focused-browser-traces
          path: artifacts/playwright
          retention-days: 7
