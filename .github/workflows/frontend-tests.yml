name: Frontend behavior tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/relay-server*'
      - 'relay-worker/src/**'
      - 'playwright*.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for manual verification when a hosted pool is busy
        type: choice
        default: macos-15-intel
        options: [macos-15, macos-15-intel, macos-26]

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:relay

  behavior:
    # Editing fixtures exercise macOS Command-key and clipboard behavior.
    # Keep one browser worker per runner; split the complete suite across jobs
    # so slow WebKit cases do not exhaust the job before artifacts are saved.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise the full desktop, mobile, and WebKit browser suite
        timeout-minutes: 22
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/playwright/results.json
        run: pnpm test:visual --workers=1 --shard=${{ matrix.shard }}/6 --reporter=list,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-results-${{ matrix.shard }}
          path: artifacts/playwright
          retention-days: 7

  lexical:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise Lexical Notes on desktop, mobile, and WebKit
        timeout-minutes: 14
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/playwright-notes-editors/results.json
        run: pnpm exec playwright test --config playwright.notes-editors.config.ts --project=lexical --project=lexical-mobile --project=lexical-webkit --workers=1 --reporter=list,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-lexical-results
          path: artifacts/playwright-notes-editors
          retention-days: 7
