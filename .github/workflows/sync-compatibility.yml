name: Sync version compatibility
on:
  push:
    branches: [main, 'feat/forward-compatible-sync']
    paths: ['src-tauri/**', 'src/lib/store.ts', 'src/lib/entityPatch.ts', '.github/scripts/sync-compat*', '.github/workflows/sync-compatibility.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        previous: [v0.6.8, v0.6.7]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compat-target
          key: ${{ runner.os }}-sync-compat-${{ matrix.previous }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sync-compat-${{ matrix.previous }}-
      - name: Build real current and released engines with the same synthetic fixture driver
        id: engines
        env:
          PREVIOUS_VERSION: ${{ matrix.previous }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/compat-target
        run: |
          set -euo pipefail
          git worktree add --detach ../previous "$PREVIOUS_VERSION"
          git worktree add --detach ../future HEAD
          # Model an additive next release: it knows a collection that the
          # foundation reader deliberately does not include in its UI schema.
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('../future/src-tauri/src/lib.rs')
          source = path.read_text().replace('const ENTITY_COLLECTIONS: [&str; 10]', 'const ENTITY_COLLECTIONS: [&str; 11]')
          source = source.replace('const LISTS_METRICS_KEYS: [&str; 7]', 'const LISTS_METRICS_KEYS: [&str; 8]')
          source = source.replace('    "projectCheckIns",', '    "projectCheckIns",\n    "futureHabitCheckIns",')
          source = source.replace('"projectCheckIns": lists_metrics_data["projectCheckIns"].clone(),', '"projectCheckIns": lists_metrics_data["projectCheckIns"].clone(),\n        "futureHabitCheckIns": lists_metrics_data["futureHabitCheckIns"].clone(),')
          path.write_text(source)
          PYTHON
          for checkout in ../previous ../future .; do
            cp .github/scripts/sync-compat-driver.rs "$checkout/src-tauri/src/sync_compat_driver.rs"
            printf '\n#[cfg(test)]\nmod sync_compat_driver;\n' >> "$checkout/src-tauri/src/lib.rs"
            cargo test --manifest-path "$checkout/src-tauri/Cargo.toml" --lib --no-run --message-format=json > build-messages.json
            engine_output=previous-engine
            if [[ "$checkout" == . ]]; then
              engine_output=current-engine
            elif [[ "$checkout" == ../future ]]; then
              engine_output=future-engine
            fi
            node -e 'const fs = require("fs"); const rows = fs.readFileSync("build-messages.json", "utf8").trim().split("\n").map(JSON.parse); const executable = rows.findLast(r => r.reason === "compiler-artifact" && r.profile.test && r.executable)?.executable; if (!executable) throw Error("Missing test executable"); fs.copyFileSync(executable, process.argv[1]); fs.chmodSync(process.argv[1], 0o755)' "$engine_output"
          done
      - name: Verify upgrades and future-feature interoperability
        run: node .github/scripts/sync-compatibility.mjs "$PWD/previous-engine" "$PWD/current-engine" "$PWD/future-engine"
      - name: Test current encrypted database and reconciliation engine
        if: always() && steps.engines.outcome == 'success'
        run: ./current-engine --skip compatibility_process_driver
      - name: Save compiled engine dependencies
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compat-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
