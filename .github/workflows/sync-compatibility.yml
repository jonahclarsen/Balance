name: Sync version compatibility
on:
  push:
    branches: [main, 'feat/forward-compatible-sync']
    tags: ['v*.*.*']
    paths: ['src-tauri/**', 'src/lib/store.ts', 'src/lib/entityPatch.ts', 'src/lib/types.ts', 'src/lib/planner.ts', 'tests/visual/entity-storage.spec.ts', 'tests/visual/projects.spec.ts', 'tests/unit/entity-patch.spec.ts', '.github/scripts/sync-compat*', '.github/workflows/sync-compatibility.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baselines:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Keep upgrade fixtures and the oldest released foundation reader
        id: select
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          versions = ['v0.6.7', 'v0.6.8']
          tags = subprocess.check_output(['git', 'tag', '--sort=version:refname'], text=True).splitlines()
          for tag in tags:
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-all)?', tag):
                  continue
              result = subprocess.run(['git', 'show', f'{tag}:src-tauri/src/sync/mod.rs'], text=True, capture_output=True)
              if re.search(r'pub const PROTOCOL_VERSION: u32 = 6;', result.stdout):
                  versions.append(tag)
                  break
          print('Compatibility baselines:', versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('versions=' + json.dumps(versions) + '\n')
          PYTHON
  compatibility:
    needs: [baselines, record-ui]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        previous: ${{ fromJSON(needs.baselines.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compat-target
          key: ${{ runner.os }}-sync-compat-${{ matrix.previous }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sync-compat-${{ matrix.previous }}-
      - name: Build real current and released engines with the same synthetic fixture driver
        id: engines
        env:
          PREVIOUS_VERSION: ${{ matrix.previous }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/compat-target
        run: |
          set -euo pipefail
          git worktree add --detach ../previous "$PREVIOUS_VERSION"
          git worktree add --detach ../future HEAD
          # Model an additive next release: it knows a collection that the
          # foundation reader deliberately does not include in its UI schema.
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('../future/src-tauri/src/lib.rs')
          source = path.read_text().replace('const ENTITY_COLLECTIONS: [&str; 11]', 'const ENTITY_COLLECTIONS: [&str; 12]')
          source = source.replace('const LISTS_METRICS_KEYS: [&str; 7]', 'const LISTS_METRICS_KEYS: [&str; 8]')
          source = source.replace('    "projectCheckIns",', '    "projectCheckIns",\n    "futureHabitCheckIns",')
          source = source.replace('"projectCheckIns": lists_metrics_data["projectCheckIns"].clone(),', '"projectCheckIns": lists_metrics_data["projectCheckIns"].clone(),\n        "futureHabitCheckIns": lists_metrics_data["futureHabitCheckIns"].clone(),')
          path.write_text(source)
          PYTHON
          for checkout in ../previous ../future .; do
            cp .github/scripts/sync-compat-driver.rs "$checkout/src-tauri/src/sync_compat_driver.rs"
            printf '\n#[cfg(test)]\nmod sync_compat_driver;\n' >> "$checkout/src-tauri/src/lib.rs"
            cargo test --manifest-path "$checkout/src-tauri/Cargo.toml" --lib --no-run --message-format=json > build-messages.json
            engine_output=previous-engine
            if [[ "$checkout" == . ]]; then
              engine_output=current-engine
            elif [[ "$checkout" == ../future ]]; then
              engine_output=future-engine
            fi
            node -e 'const fs = require("fs"); const rows = fs.readFileSync("build-messages.json", "utf8").trim().split("\n").map(JSON.parse); const executable = rows.findLast(r => r.reason === "compiler-artifact" && r.profile.test && r.executable)?.executable; if (!executable) throw Error("Missing test executable"); fs.copyFileSync(executable, process.argv[1]); fs.chmodSync(process.argv[1], 0o755)' "$engine_output"
          done
      - name: Upload standalone synthetic fixture engines
        uses: actions/upload-artifact@v7
        with:
          name: sync-compat-engines-${{ matrix.previous }}
          path: |
            previous-engine
            current-engine
            future-engine
          retention-days: 7
      - uses: actions/download-artifact@v7
        with:
          name: frontend-entity-fixtures
          path: frontend-entity-fixtures
      - name: Verify upgrades and future-feature interoperability
        run: node .github/scripts/sync-compatibility.mjs "$PWD/previous-engine" "$PWD/current-engine" "$PWD/future-engine" "$PWD/frontend-entity-fixtures"
      - name: Test current encrypted database and reconciliation engine
        if: always() && steps.engines.outcome == 'success'
        run: ./current-engine --skip compatibility_process_driver
      - name: Save compiled engine dependencies
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compat-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  record-ui:
    name: Generic record UI and patch behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check && pnpm test:unit
      - name: Exercise entity features and undo on desktop and mobile
        run: pnpm exec playwright test tests/visual/entity-storage.spec.ts tests/visual/projects.spec.ts --workers=2
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-entity-fixtures
          path: artifacts/entity-fixtures
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: record-ui-failure-traces
          path: artifacts/playwright
          retention-days: 7
