name: Profile tauri dev vs release

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Launches of each build per load level
        default: "3"

permissions:
  contents: read

concurrency:
  group: dev-vs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Real macOS app with synthetic data
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # Rust links Swift bridge objects directly, so add Swift's runtime rpath.
      RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/swift
      BALANCE_TYPING_PROFILE_ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust build
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-dev-vs-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dev-vs-release-
      - run: pnpm install --frozen-lockfile
      - name: Use a disposable unlocked keychain
        run: |
          password="$(uuidgen)"
          keychain="$RUNNER_TEMP/profile.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Build release app
        run: >
          pnpm tauri build --no-bundle --features typing-profile
          --config '{"build":{"beforeBuildCommand":"pnpm exec vite build"}}'
      - name: Build dev app
        run: cargo build --manifest-path src-tauri/Cargo.toml --features typing-profile
      - name: Save Rust build
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-dev-vs-release-${{ github.sha }}
      - name: Measure
        run: node scripts/profile-tauri-typing.mjs "$RUNNER_TEMP/tauri-typing"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-vs-release
          path: ${{ runner.temp }}/tauri-typing/
          if-no-files-found: warn
