name: Build macOS arm64 app

on:
  push:
    tags:
      # Desktop release builds are opt-in: append `-all` to the version tag.
      - "v*.*.*-all"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and notarize .app
    runs-on: macos-15

    env:
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
      NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify notification bridge in dev executables
        run: node scripts/test-macos-task-notifications.mjs

      - name: Verify rich note clipboard conversion with synthetic attachments
        run: |
          swiftc src-tauri/macos/NoteClipboardBridge.swift src-tauri/macos/NoteClipboardBridgeTests.swift -o "$RUNNER_TEMP/note-clipboard-tests"
          "$RUNNER_TEMP/note-clipboard-tests"

      - name: Resolve app version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid macOS release version: $VERSION"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        run: |
          if [[ -z "$SIGNING_CERTIFICATE_P12" || -z "$SIGNING_IDENTITY" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::Release builds must be signed, but the signing secrets are missing"
              exit 1
            fi
            echo "::warning::Signing secrets are missing; building an ad-hoc signed app"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Tauri signs the app and scripts/build-macos-widget.mjs signs the
          # extensions with this identity.
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "BALANCE_NOTARIZE=1" >> "$GITHUB_ENV"

      - name: Build macOS arm64 app
        run: |
          pnpm tauri build \
            --config "{\"version\":\"$APP_VERSION\"}" \
            --target aarch64-apple-darwin \
            --bundles app

      - name: Verify and package app
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balance.app"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/Balance"
          PLIST="$APP_PATH/Contents/Info.plist"

          test -d "$APP_PATH"
          WIDGET_PATH="$APP_PATH/Contents/PlugIns/BalanceWidget.appex"
          WIDGET_EXECUTABLE="$WIDGET_PATH/Contents/MacOS/BalanceWidget"
          WIDGET_PLIST="$WIDGET_PATH/Contents/Info.plist"
          test -d "$WIDGET_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_PLIST")" = "com.apple.widgetkit-extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_PLIST")" = "$APP_VERSION"
          file "$WIDGET_EXECUTABLE" | tee widget-architecture.txt
          file "$WIDGET_EXECUTABLE" | grep -q "arm64"
          nm "$WIDGET_EXECUTABLE" | grep -q "U _NSExtensionMain"
          codesign --verify --strict "$WIDGET_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          file "$APP_EXECUTABLE" | tee executable-architecture.txt
          file "$APP_EXECUTABLE" | grep -q "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$APP_VERSION"

          if [[ "${BALANCE_NOTARIZE:-}" == "1" ]]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$NOTARY_API_KEY_P8" | base64 --decode > "$API_KEY_PATH"
            ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarization.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
              --key "$API_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m
            rm "$API_KEY_PATH"
            # Stapling fetches the ticket from Apple's CDN, which can drop.
            for attempt in 1 2 3; do
              xcrun stapler staple "$APP_PATH" && break
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
              sleep 20
            done
            spctl --assess --type execute --verbose=2 "$APP_PATH"
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Balance-macos-arm64.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Balance-macos-arm64
          path: |
            Balance-macos-arm64.app.zip
            executable-architecture.txt
            widget-architecture.txt
          if-no-files-found: error

  publish-nightly:
    name: Attach to the nightly release
    needs: build
    # The nightly coordinator dispatches this workflow at a plain version tag.
    # `-all` tags are published by release.yml instead.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      !endsWith(github.ref_name, '-all')
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Attach the notarized Mac app if the release is published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          MACOS_RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/attach-nightly-macos.sh
