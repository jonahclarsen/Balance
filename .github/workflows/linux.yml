name: Build Linux app

on:
  push:
    tags:
      # Desktop release builds are opt-in: append `-all` to the version tag.
      - "v*.*.*-all"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test AppImage + deb
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xauth \
            xvfb

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve app version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Linux release version: $VERSION"
            exit 1
          fi
          # Tauri's CLI config override controls bundle filenames, while its
          # generated Debian metadata can read the physical config and Rust
          # package version during compilation. Keep all version sources in
          # sync for tag builds without requiring a source version bump commit.
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs')
          const version = process.argv[2]
          const cargoPath = 'src-tauri/Cargo.toml'
          const cargoInput = fs.readFileSync(cargoPath, 'utf8')
          if (!/^version = "[^"]+"$/m.test(cargoInput)) {
            throw new Error('Could not find the Rust package version')
          }
          const cargoOutput = cargoInput.replace(/^version = "[^"]+"$/m, `version = "${version}"`)
          fs.writeFileSync(cargoPath, cargoOutput)

          const tauriPath = 'src-tauri/tauri.conf.json'
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'))
          tauriConfig.version = version
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)
          NODE
          grep -q "^version = \"$VERSION\"$" src-tauri/Cargo.toml
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Linux packages
        run: |
          pnpm tauri build \
            --config "{\"version\":\"$APP_VERSION\"}" \
            --bundles appimage,deb

      - name: Verify packages
        id: packages
        run: |
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*_${APP_VERSION}_*.AppImage" -print -quit)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name "*_${APP_VERSION}_*.deb" -print -quit)"

          test -n "$APPIMAGE"
          test -n "$DEB"
          test -x "$APPIMAGE"
          file src-tauri/target/release/Balance | tee executable-architecture.txt
          file src-tauri/target/release/Balance | grep -q "ELF 64-bit.*x86-64"

          # Extracted here so the smoke-test step below can run ./squashfs-root/AppRun.
          "$APPIMAGE" --appimage-extract >/dev/null

          dpkg-deb --contents "$DEB" | tee deb-contents.txt
          DEB_VERSION="$(dpkg-deb --field "$DEB" Version)"
          echo "Debian package version: $DEB_VERSION"
          # Debian permits a packaging revision suffix (for example
          # 0.2.2-1). The upstream application version before that suffix must
          # still match the version tag.
          if [[ "$DEB_VERSION" != "$APP_VERSION" && "$DEB_VERSION" != "$APP_VERSION-"* ]]; then
            echo "::error::Expected Debian version $APP_VERSION, got $DEB_VERSION"
            exit 1
          fi

          cp "$APPIMAGE" Balance-linux-x86_64.AppImage
          cp "$DEB" Balance-linux-x86_64.deb

      - name: Smoke-test packaged app startup
        run: |
          set +e
          timeout 15s dbus-run-session -- xvfb-run -a \
            ./squashfs-root/AppRun >linux-smoke-test.log 2>&1
          STATUS=$?
          set -e

          cat linux-smoke-test.log
          if [[ "$STATUS" -ne 0 && "$STATUS" -ne 124 ]]; then
            echo "::error::Packaged app exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Balance-linux-x86_64
          path: |
            Balance-linux-x86_64.AppImage
            Balance-linux-x86_64.deb
            executable-architecture.txt
            deb-contents.txt
            linux-smoke-test.log
          if-no-files-found: error
